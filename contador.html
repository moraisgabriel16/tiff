<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dormir Agarrado com a Tiff 🔥</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,600;1,300;1,600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:      #0d0a0e;
    --bg2:     #120e14;
    --wine:    #8b1a3a;
    --rose:    #c9445e;
    --hot:     #e8607a;
    --blush:   #f0a0b0;
    --cream:   #f5e6e8;
    --dim:     #4a3040;
    --mono:    'Space Mono', monospace;
    --serif:   'Cormorant Garamond', serif;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--cream);
    font-family: var(--serif);
    overflow: hidden;
  }

  /* ── canvas bg ── */
  #canvas-bg {
    position: fixed;
    inset: 0;
    z-index: 0;
  }

  /* ── vignette ── */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 30%, rgba(13,10,14,0.85) 100%);
    pointer-events: none;
    z-index: 1;
  }

  /* ── layout ── */
  .stage {
    position: relative;
    z-index: 2;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0;
    padding: 2rem 1.5rem;
  }

  /* ── top label ── */
  .eyebrow {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--rose);
    opacity: 0;
    animation: appear 0.8s 0.1s ease forwards;
    margin-bottom: 1.2rem;
  }

  /* ── title ── */
  .title-wrap {
    text-align: center;
    opacity: 0;
    animation: appear 1s 0.3s ease forwards;
    margin-bottom: 2.5rem;
  }
  .title-wrap h1 {
    font-family: var(--serif);
    font-size: clamp(2rem, 6vw, 4.2rem);
    font-weight: 300;
    font-style: italic;
    line-height: 1.15;
    color: var(--cream);
  }
  .title-wrap h1 strong {
    font-weight: 600;
    font-style: italic;
    color: var(--hot);
    display: block;
  }

  /* ── heat bar ── */
  .heat-bar {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 2.5rem;
    opacity: 0;
    animation: appear 0.8s 0.55s ease forwards;
  }
  .heat-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--dim);
    transition: background 0.4s;
  }
  .heat-dot.lit { background: var(--rose); box-shadow: 0 0 8px var(--rose); }
  .heat-dot.hot { background: var(--hot); box-shadow: 0 0 12px var(--hot); }

  /* ── clock ── */
  .clock-row {
    display: flex;
    align-items: flex-start;
    gap: clamp(8px, 2.5vw, 28px);
    opacity: 0;
    animation: appear 1s 0.5s ease forwards;
    margin-bottom: 2rem;
  }
  .unit {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .digits {
    font-family: var(--mono);
    font-size: clamp(3rem, 9vw, 6.5rem);
    font-weight: 700;
    color: var(--cream);
    line-height: 1;
    min-width: 2ch;
    text-align: center;
    position: relative;
    transition: color 0.25s;
  }
  .digits.flash { color: var(--hot); }
  .digits::after {
    content: '';
    position: absolute;
    bottom: -4px; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--wine), transparent);
  }
  .lbl {
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--dim);
  }
  .sep {
    font-family: var(--mono);
    font-size: clamp(2.5rem, 7vw, 5rem);
    color: var(--wine);
    line-height: 1;
    padding-top: 0.05em;
    animation: blink 1.2s step-end infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.15; }
  }

  /* ── progress ── */
  .progress-area {
    width: 100%;
    max-width: 520px;
    opacity: 0;
    animation: appear 0.8s 0.8s ease forwards;
    margin-bottom: 2rem;
  }
  .prog-labels {
    display: flex;
    justify-content: space-between;
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 0.15em;
    color: var(--dim);
    text-transform: uppercase;
    margin-bottom: 7px;
  }
  .prog-track {
    height: 3px;
    background: #2a1a20;
    border-radius: 99px;
    overflow: hidden;
    position: relative;
  }
  .prog-fill {
    height: 100%;
    border-radius: 99px;
    background: linear-gradient(90deg, var(--wine), var(--rose), var(--hot));
    transition: width 1s linear;
    position: relative;
  }
  .prog-fill::after {
    content: '';
    position: absolute;
    right: 0; top: 50%;
    transform: translate(50%, -50%);
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--hot);
    box-shadow: 0 0 10px var(--hot);
  }
  #pct-label {
    font-family: var(--mono);
    font-size: 9px;
    color: var(--rose);
    text-align: right;
    margin-top: 5px;
    letter-spacing: 0.1em;
  }

  /* ── phrase ── */
  .phrase {
    max-width: 420px;
    text-align: center;
    opacity: 0;
    animation: appear 1s 1s ease forwards;
  }
  .phrase p {
    font-family: var(--serif);
    font-style: italic;
    font-size: clamp(0.95rem, 2.2vw, 1.15rem);
    color: #7a4555;
    line-height: 1.8;
  }
  .phrase p span {
    color: var(--blush);
  }
  .highlight {
    display: inline;
    background: var(--rose);
    color: #0d0a0e;
    font-style: italic;
    font-weight: 600;
    padding: 0.05em 0.4em 0.1em;
    border-radius: 2px;
    box-decoration-break: clone;
    -webkit-box-decoration-break: clone;
    line-height: 1.5;
    box-shadow: 2px 2px 0 rgba(0,0,0,0.35);
  }

  /* ── done ── */
  .done-screen {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 10;
    background: var(--bg);
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.5rem;
    text-align: center;
    padding: 2rem;
  }
  .done-screen .fire { font-size: 5rem; animation: pulse 1s ease infinite; }
  .done-screen h2 {
    font-family: var(--serif);
    font-style: italic;
    font-size: clamp(2.2rem, 7vw, 4rem);
    font-weight: 300;
    color: var(--hot);
    line-height: 1.2;
  }
  .done-screen p {
    font-family: var(--serif);
    font-style: italic;
    font-size: 1.1rem;
    color: var(--blush);
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50%       { transform: scale(1.2); }
  }

  @keyframes appear {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 480px) {
    .clock-row { gap: 6px; }
    .sep { padding-top: 0; }
  }
</style>
</head>
<body>

<!-- Particle canvas -->
<canvas id="canvas-bg"></canvas>

<div class="stage">

  <p class="eyebrow">⟡ contagem regressiva ⟡</p>

  <div class="title-wrap">
    <h1>
      dormir agarrado<br>com você,
      <strong>Tiff 🔥</strong>
    </h1>
  </div>

  <div class="heat-bar" id="heatBar">
    <div class="heat-dot" id="d0"></div>
    <div class="heat-dot" id="d1"></div>
    <div class="heat-dot" id="d2"></div>
    <div class="heat-dot" id="d3"></div>
    <div class="heat-dot" id="d4"></div>
    <div class="heat-dot" id="d5"></div>
    <div class="heat-dot" id="d6"></div>
    <div class="heat-dot" id="d7"></div>
  </div>

  <div class="clock-row">
    <div class="unit">
      <div class="digits" id="days">--</div>
      <div class="lbl">dias</div>
    </div>
    <div class="sep">:</div>
    <div class="unit">
      <div class="digits" id="hours">--</div>
      <div class="lbl">horas</div>
    </div>
    <div class="sep">:</div>
    <div class="unit">
      <div class="digits" id="minutes">--</div>
      <div class="lbl">min</div>
    </div>
    <div class="sep">:</div>
    <div class="unit">
      <div class="digits" id="seconds">--</div>
      <div class="lbl">seg</div>
    </div>
  </div>

  <div class="progress-area">
    <div class="prog-labels">
      <span>agora</span>
      <span>27/06 · 18h00</span>
    </div>
    <div class="prog-track">
      <div class="prog-fill" id="bar" style="width:0%"></div>
    </div>
    <div id="pct-label">0.0% concluído</div>
  </div>

  <div class="phrase">
    <p>
      "quero sentir esse cheiro<br>
      que me deixa maluco,<br>
      <span class="highlight">MINHA MULHER</span>"
    </p>
  </div>

  <!-- done screen -->
  <div class="done-screen" id="doneScreen">
    <span class="fire">🔥</span>
    <h2>chegou a hora,<br>Tiff…</h2>
    <p>vai lá me abraçar logo 🥰</p>
  </div>

</div>

<script>
/* ── particle canvas ── */
const canvas = document.getElementById('canvas-bg');
const ctx    = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const COLORS = ['#8b1a3a','#c9445e','#e8607a','#f0a0b0','#3d1020'];
const particles = Array.from({length: 70}, () => ({
  x: Math.random() * 9999,
  y: Math.random() * 9999,
  r: 0.5 + Math.random() * 1.5,
  speed: 0.08 + Math.random() * 0.2,
  angle: Math.random() * Math.PI * 2,
  color: COLORS[Math.floor(Math.random() * COLORS.length)],
  opacity: 0.1 + Math.random() * 0.35
}));

function drawParticles() {
  ctx.clearRect(0, 0, W, H);
  for (const p of particles) {
    p.x += Math.cos(p.angle) * p.speed;
    p.y += Math.sin(p.angle) * p.speed;
    if (p.x < 0) p.x = W; if (p.x > W) p.x = 0;
    if (p.y < 0) p.y = H; if (p.y > H) p.y = 0;
    ctx.beginPath();
    ctx.arc(p.x % W, p.y % H, p.r, 0, Math.PI * 2);
    ctx.fillStyle = p.color + Math.round(p.opacity * 255).toString(16).padStart(2,'0');
    ctx.fill();
  }
  requestAnimationFrame(drawParticles);
}
drawParticles();

/* ── countdown ── */
const target  = new Date('2026-06-27T18:00:00');
const start   = new Date('2026-06-23T00:00:00'); // today reference
const totalMs = target - start;
const pad     = n => String(n).padStart(2, '0');

let prevSec = -1;

function updateHeat(pct) {
  const dots = document.querySelectorAll('.heat-dot');
  const lit  = Math.round(pct / 100 * dots.length);
  dots.forEach((d, i) => {
    d.className = 'heat-dot';
    if (i < lit - 1) d.classList.add('lit');
    if (i === lit - 1) d.classList.add('hot');
  });
}

function tick() {
  const now  = new Date();
  const diff = target - now;

  if (diff <= 0) {
    document.getElementById('doneScreen').style.display = 'flex';
    return;
  }

  const d = Math.floor(diff / 86400000);
  const h = Math.floor((diff % 86400000) / 3600000);
  const m = Math.floor((diff % 3600000)  / 60000);
  const s = Math.floor((diff % 60000)    / 1000);

  document.getElementById('days').textContent    = pad(d);
  document.getElementById('hours').textContent   = pad(h);
  document.getElementById('minutes').textContent = pad(m);
  document.getElementById('seconds').textContent = pad(s);

  if (s !== prevSec) {
    const el = document.getElementById('seconds');
    el.classList.add('flash');
    clearTimeout(el._t);
    el._t = setTimeout(() => el.classList.remove('flash'), 300);
    prevSec = s;
  }

  const elapsed = Math.max(0, totalMs - diff);
  const pct = Math.min(100, (elapsed / totalMs) * 100);
  document.getElementById('bar').style.width = pct.toFixed(2) + '%';
  document.getElementById('pct-label').textContent = pct.toFixed(1) + '% concluído';
  updateHeat(pct);
}

tick();
setInterval(tick, 1000);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para Tiffany ✨</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tahoma', 'Geneva', 'Verdana', sans-serif;
    }

    body {
      background: #0d0208;
      background-image: 
        radial-gradient(circle at 50% 30%, #3a001e 0%, #0d0208 80%),
        repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.03), rgba(255, 255, 255, 0.03) 1px, transparent 1px, transparent 2px);
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
      overflow-x: hidden;
      position: relative;
    }

    /* CAMADA DOS MORCEGOS ANIMADOS */
    .bat {
      position: absolute;
      font-size: 1.5rem;
      opacity: 0.35;
      pointer-events: none;
      user-select: none;
      z-index: 1;
      filter: drop-shadow(0 0 6px rgba(255, 0, 85, 0.6));
    }

    .bat1 { top: 10%; left: -50px; animation: flyRight 14s linear infinite; }
    .bat2 { top: 35%; right: -50px; animation: flyLeft 18s linear infinite 3s; }
    .bat3 { top: 75%; left: -50px; animation: flyRight 12s linear infinite 6s; }
    .bat4 { top: 85%; right: -50px; animation: flyLeft 16s linear infinite 1s; }

    @keyframes flyRight {
      0% { transform: translateX(0) translateY(0) scale(0.8) rotate(5deg); }
      25% { transform: translateX(35vw) translateY(-20px) scale(1) rotate(-5deg); }
      50% { transform: translateX(65vw) translateY(15px) scale(0.9) rotate(5deg); }
      75% { transform: translateX(85vw) translateY(-10px) scale(1.1) rotate(-3deg); }
      100% { transform: translateX(110vw) translateY(0) scale(0.8) rotate(5deg); }
    }

    @keyframes flyLeft {
      0% { transform: translateX(0) translateY(0) scale(0.8) rotate(-5deg); }
      25% { transform: translateX(-30vw) translateY(15px) scale(1.1) rotate(5deg); }
      50% { transform: translateX(-60vw) translateY(-10px) scale(0.9) rotate(-5deg); }
      75% { transform: translateX(-85vw) translateY(20px) scale(3deg); }
      100% { transform: translateX(-110vw) translateY(0) scale(0.8) rotate(-5deg); }
    }

    .container {
      background: linear-gradient(180deg, #1f0212 0%, #0a0106 100%);
      border: 2px solid #ff0055;
      border-radius: 12px;
      max-width: 600px;
      width: 100%;
      padding: 20px;
      box-shadow: 
        0 0 20px rgba(255, 0, 85, 0.4),
        inset 0 1px 1px rgba(255, 255, 255, 0.3),
        inset 0 -2px 5px rgba(0, 0, 0, 0.8);
      position: relative;
      z-index: 2;
    }

    /* BARRA SUPERIOR Y2K */
    .window-header {
      background: linear-gradient(90deg, #ff0055 0%, #880033 100%);
      margin: -20px -20px 20px -20px;
      padding: 10px 14px;
      border-top-left-radius: 9px;
      border-top-right-radius: 9px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.4);
      border-bottom: 1px solid #330011;
      gap: 8px;
    }

    .window-title {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #fff;
      font-size: 0.8rem;
      font-weight: bold;
      letter-spacing: 0.5px;
      text-shadow: 1px 1px 2px #000;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .window-controls {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }

    .win-btn {
      width: 14px;
      height: 14px;
      border-radius: 3px;
      border: 1px solid rgba(0, 0, 0, 0.5);
      background: linear-gradient(180deg, #ffffff 0%, #cccccc 100%);
      font-size: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      font-weight: bold;
      cursor: pointer;
    }

    /* BARRA DE PROGRESSO */
    .progress-bar {
      height: 10px;
      background: #000;
      border-radius: 6px;
      border: 1px solid #ff0055;
      margin-bottom: 20px;
      overflow: hidden;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.8);
      padding: 1px;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(180deg, #ff6699 0%, #ff0055 50%, #b3003b 100%);
      border-radius: 4px;
      width: 0%;
      transition: width 0.4s ease;
      box-shadow: 0 0 8px #ff0055;
    }

    .step {
      display: none;
      animation: fadeIn 0.4s ease forwards;
    }

    .step.active {
      display: block;
    }

    h1 {
      font-size: 1.3rem;
      color: #ff66a3;
      text-shadow: 0 0 8px rgba(255, 102, 163, 0.5), 1px 1px 0px #000;
      margin-bottom: 14px;
      font-weight: bold;
    }

    h2 {
      font-size: 1.05rem;
      line-height: 1.4;
      margin-bottom: 18px;
      color: #ffe6f0;
      text-shadow: 1px 1px 2px #000;
    }

    p {
      color: #cca3b8;
      line-height: 1.5;
      margin-bottom: 16px;
      font-size: 0.92rem;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn {
      background: linear-gradient(180deg, #330018 0%, #1a000c 50%, #0d0006 100%);
      border: 1px solid #ff0055;
      border-radius: 8px;
      color: #ffffff;
      padding: 12px 16px;
      font-size: 0.88rem;
      text-align: left;
      cursor: pointer;
      box-shadow: 
        inset 0 1px 1px rgba(255, 255, 255, 0.2),
        0 2px 5px rgba(0,0,0,0.5);
      transition: all 0.2s ease;
      text-shadow: 1px 1px 1px #000;
      line-height: 1.3;
    }

    .btn:hover {
      background: linear-gradient(180deg, #ff0055 0%, #cc0044 50%, #88002e 100%);
      border-color: #ff66a3;
      box-shadow: 0 0 12px rgba(255, 0, 85, 0.8);
    }

    .note {
      margin-top: 16px;
      padding: 14px;
      background: rgba(255, 0, 85, 0.1);
      border: 1px dashed #ff0055;
      border-radius: 8px;
      font-size: 0.9rem;
      color: #ffb3d1;
      line-height: 1.5;
    }

    .quote-box {
      margin-top: 16px;
      border-left: 3px solid #ff0055;
      padding-left: 12px;
      font-style: italic;
      color: #ffcca3;
      font-size: 0.9rem;
      line-height: 1.5;
      background: rgba(0, 0, 0, 0.3);
      padding: 10px 12px;
      border-radius: 0 8px 8px 0;
    }

    .summary-box {
      background: rgba(0, 0, 0, 0.5);
      border-left: 3px solid #ff0055;
      padding: 10px 14px;
      margin-bottom: 16px;
      font-size: 0.85rem;
      color: #ffccd9;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

  let questions = [];
  let currentQuestionIndex = 0;
  let totalScore = 0;
  const userAnswers = [];

  function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
  }

  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  function playClickSound() {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(800, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.05);
    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.05);
  }

  function playFinishSound() {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const notes = [523.25, 659.25, 783.99, 1046.50];
    notes.forEach((freq, index) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.12, audioCtx.currentTime + index * 0.1);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + index * 0.1 + 0.3);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(audioCtx.currentTime + index * 0.1);
      osc.stop(audioCtx.currentTime + index * 0.1 + 0.3);
    });
  }

  function startQuiz() {
    playClickSound();
    questions = shuffle([...rawQuestions]).map(q => ({
      question: q.question,
      options: shuffle([...q.options])
    }));
    
    currentQuestionIndex = 0;
    totalScore = 0;
    userAnswers.length = 0;

    document.getElementById('step-start').classList.remove('active');
    document.getElementById('step-quiz').classList.add('active');
    renderQuestion();
  }

  function renderQuestion() {
    const q = questions[currentQuestionIndex];
    
    document.getElementById('question-text').innerText = `${currentQuestionIndex + 1}. ${q.question}`;
    
    const container = document.getElementById('options-container');
    container.innerHTML = '';

    q.options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'btn';
      btn.innerText = opt.text;
      btn.onclick = () => selectOption(opt);
      container.appendChild(btn);
    });

    const progressPercent = (currentQuestionIndex / questions.length) * 100;
    document.getElementById('progress').style.width = `${progressPercent}%`;
  }

  function selectOption(option) {
    userAnswers.push(option.summary);
    totalScore += option.score;
    currentQuestionIndex++;

    if (currentQuestionIndex < questions.length) {
      playClickSound();
      renderQuestion();
    } else {
      showFinalScreen();
    }
  }

  function showFinalScreen() {
    playFinishSound();
    document.getElementById('progress').style.width = '100%';
    document.getElementById('step-quiz').classList.remove('active');
    document.getElementById('step-final').classList.add('active');

    const finalContainer = document.getElementById('final-content');
    const isPositive = totalScore >= (questions.length * 0.5);

    if (isPositive) {
      // CENÁRIO POSITIVO / AMOROSO
      finalContainer.innerHTML = `
        <h1>Olha aqui pra mim... 🕵️‍♂️🖤</h1>
        
        <div class="summary-box">
          <strong>Suas escolhas no caminho:</strong><br>• ${userAnswers.slice(-5).join('<br>• ')}
        </div>

        </div>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arraste e descubra</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,900;1,500&family=Inter:wght@300;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--red:#e10600;--red2:#7a0000;--text:#f3e9e9;--muted:#a58a8a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0a0a;--red:#e10600;--text:#f3e9e9}}
:root[data-theme="dark"]{--bg:#0a0a0a;--red:#e10600;--text:#f3e9e9}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#3a0000,var(--bg) 65%);color:var(--text);font-family:'Inter',system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px 16px;overflow-x:hidden;user-select:none;-webkit-user-select:none}
h1{font-family:'Playfair Display',Georgia,serif;font-weight:900;font-size:clamp(28px,8vw,40px);margin:0;color:var(--red);text-shadow:0 0 22px rgba(225,6,0,.55);text-align:center}
.sub{font-weight:300;color:var(--muted);margin:0;font-size:14px;text-align:center}
.stage{position:relative;width:min(100%,380px);aspect-ratio:3/4;border:1px solid var(--red2);border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 0 50px rgba(225,6,0,.3)}
.stage img.pic{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;transition:opacity .9s}
canvas.gone{opacity:0;pointer-events:none}
.mascot{position:absolute;width:55px;height:30px;image-rendering:pixelated;pointer-events:none;transform:translate(-50%,-110%);display:none;z-index:2}
.bar{width:min(100%,380px);height:8px;border-radius:99px;background:#1c0a0a;border:1px solid var(--red2);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--red2),var(--red));transition:width .15s}
.msg{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-size:22px;text-align:center;min-height:30px;margin:0}
button{font:500 15px 'Inter',sans-serif;background:transparent;color:var(--text);border:1px solid var(--red);border-radius:99px;padding:10px 24px;cursor:pointer;display:none}
button:focus-visible{outline:2px solid var(--red);outline-offset:3px}
@media (prefers-reduced-motion:reduce){canvas{transition:none}}
</style>
</head>
<body>

<div class="bar"><i id="p"></i></div>
<p class="msg" id="msg">0%</p>
<button id="again">Jogar de novo</button>
<script>
const st=document.getElementById('stage'),c=document.getElementById('c'),x=c.getContext('2d'),m=document.getElementById('m'),
p=document.getElementById('p'),msg=document.getElementById('msg'),again=document.getElementById('again');
let W,H,down=false,last=null,done=false,tick=0;
const steps=[[0,'0%'],[15,'Continua… 😏'],[35,'Tá ficando bom…'],[55,'Quase lá 🔥'],[75,'Só mais um pouco…']];
function cover(){
  const r=st.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);
  W=c.width=Math.round(r.width*d);H=c.height=Math.round(r.height*d);
  x.globalCompositeOperation='source-over';
  const g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,'#1a0000');g.addColorStop(1,'#000');
  x.fillStyle=g;x.fillRect(0,0,W,H);
  x.strokeStyle='rgba(225,6,0,.35)';x.lineWidth=d;
  for(let i=-H;i<W;i+=18*d){x.beginPath();x.moveTo(i,H);x.lineTo(i+H,0);x.stroke()}
  x.fillStyle='#e10600';x.textAlign='center';x.font='italic 900 '+(W*.13)+'px "Playfair Display",Georgia,serif';
  x.fillText('Proibido',W/2,H*.46);x.fillText('olhar',W/2,H*.46+W*.15);
  x.globalCompositeOperation='destination-out';
}
function pos(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H,px:e.clientX-r.left,py:e.clientY-r.top}}
function scratch(a,b){
  x.lineCap=x.lineJoin='round';x.lineWidth=W*.14;x.beginPath();
  x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke();
}
function progress(){
  const s=40,t=document.createElement('canvas');t.width=s;t.height=Math.round(s*H/W);
  const k=t.getContext('2d');k.drawImage(c,0,0,t.width,t.height);
  const d=k.getImageData(0,0,t.width,t.height).data;let n=0;
  for(let i=3;i<d.length;i+=4)if(d[i]<40)n++;
  return Math.round(n/(d.length/4)*100);
}
function update(){
  const v=progress();p.style.width=Math.min(v,100)+'%';
  if(v>=60&&!done)return win();
  for(const [t,s] of steps)if(v>=t)msg.textContent=s.includes('%')?v+'%':s;
}
function win(){
  done=true;c.classList.add('gone');m.style.display='none';p.style.width='100%';
  msg.textContent='Sábado, vem fazer yoga em mim 😈';again.style.display='inline-block';
  if(navigator.vibrate)navigator.vibrate(120);
}
c.addEventListener('pointerdown',e=>{if(done)return;down=true;c.setPointerCapture(e.pointerId);last=pos(e);scratch(last,last);m.style.display='block'});
c.addEventListener('pointermove',e=>{if(!down||done)return;const n=pos(e);scratch(last,n);last=n;
  m.style.left=n.px+'px';m.style.top=n.py+'px';if(++tick%6===0)update()});
const end=()=>{down=false;m.style.display='none';if(!done)update()};
c.addEventListener('pointerup',end);c.addEventListener('pointercancel',end);
again.addEventListener('click',()=>{done=false;c.classList.remove('gone');again.style.display='none';p.style.width='0';msg.textContent='0%';cover()});
addEventListener('resize',()=>{if(!done)cover()});
cover();
</script>
